name: Run Go tests

on:
  pull_request:
    branches:
      - "main"
      - "stage/**"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
  push:
    tags:
      - "v*"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-harness-test:
    name: Test disposable PostgreSQL harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          postgres_bin_dir="$(dirname "$(find /usr/lib/postgresql -type f -name postgres | sort -V | tail -1)")"
          test -x "$postgres_bin_dir/initdb"
          echo "$postgres_bin_dir" >> "$GITHUB_PATH"

      - name: Run harness self-tests
        run: make test_postgres_harness

  call-run-upload-main-coverage-files:
    uses: ./.github/workflows/upload-coverage-files.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: call-run-upload-main-coverage-files
    steps:
      - env:
          COV_FILE_ID: ${{ needs.call-run-upload-main-coverage-files.outputs.coverage-artifact-id }}
        run: echo "Artifact ID from previous job is $COV_FILE_ID"

      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Run Tests
        run: |
          make test

      - name: Parse Coverage Value From Feature Branch
        run: |
          echo "current_coverage=$(tail -n 1 .coverage/coverage.txt | awk '{print $3}' | awk 'sub("%", "")')" >> $GITHUB_ENV

      - name: Feature Branch Coverage Value
        run: |
          printf 'Coverage Value: %s\n' "$current_coverage"

      - name: Download Main Coverage
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.call-run-upload-main-coverage-files.outputs.coverage-artifact-id }}
          path: tmp/

      - name: Display structure of downloaded files
        run: ls -R

      - name: Parse Coverage Value From Main Branch
        run: |
          echo "main_coverage=$(tail -n 1 tmp/coverage.txt | awk '{print $3}' | awk 'sub("%", "")')" >> $GITHUB_ENV

      - name: Main Coverage Value
        run: |
          printf 'Coverage Value: %s\n' "$main_coverage"

      - name: Coverage Evaluation
        run: |
          if (( $(echo "$current_coverage < $main_coverage" | bc -l))); then
            echo "Failing the workflow. Coverage on feature branch ($current_coverage%) is below main branch ($main_coverage%)"
            exit 1
          else
            echo "Coverage is within the limits"
          fi

      - name: Verify frozen fixture and generated worktree
        run: |
          make migration_preflight_fixture
          make test_update
          git diff --exit-code
  transition-containment-test-pg:
    name: Test transition containment (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dawgs
          POSTGRES_PASSWORD: weneedbetterpasswords
          POSTGRES_DB: dawgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawgs -d dawgs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Assert PostgreSQL major and refusal without implicit bootstrap
        env:
          CONNECTION_STRING: postgres://dawgs:weneedbetterpasswords@localhost:5432/dawgs?sslmode=disable
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: |
          actual_version="$(psql "$CONNECTION_STRING" -XAtqc 'show server_version_num')"
          test "$((actual_version / 10000))" = "$EXPECTED_POSTGRES_MAJOR"
          make test_transition_containment

  integration-test-neo4j:
    name: Run integration tests (neo4j)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      neo4j:
        image: neo4j:4.4.42
        env:
          NEO4J_AUTH: neo4j/weneedbetterpasswords
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 40s
    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Run integration tests
        env:
          CONNECTION_STRING: neo4j://neo4j:weneedbetterpasswords@localhost:7687
        run: |
          make test_integration

  migration-test-pg:
    name: Run migration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dawgs
          POSTGRES_PASSWORD: weneedbetterpasswords
          POSTGRES_DB: dawgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawgs -d dawgs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-restore:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dawgs
          POSTGRES_PASSWORD: weneedbetterpasswords
          POSTGRES_DB: dawgs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dawgs -d dawgs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Assert PostgreSQL major and run migration tests
        env:
          CONNECTION_STRING: postgres://dawgs:weneedbetterpasswords@localhost:5432/dawgs?sslmode=disable
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres }}
          DAWGS_TEST_POSTGRES_DISPOSABLE: "1"
        run: |
          actual_version="$(psql "$CONNECTION_STRING" -XAtqc 'show server_version_num')"
          test "$((actual_version / 10000))" = "$EXPECTED_POSTGRES_MAJOR"
          make verify_frozen_v1_client
          export DAWGS_FROZEN_V1_EXPORT="$PWD/dist/dawgs-v1-export"
          ./scripts/prepare-test-pg -- make test_migration
          ./scripts/prepare-test-pg -- make test_bootstrap
          ./scripts/prepare-test-pg -- make test_restore
          ./scripts/prepare-test-pg -- make test_rollback
          PG_TEST_RESTORE_SOURCE_ADMIN="$CONNECTION_STRING" \
          PG_TEST_RESTORE_TARGET_ADMIN="postgres://dawgs:weneedbetterpasswords@localhost:5433/dawgs?sslmode=disable" \
          PG_TEST_POSTGRES_CLIENT_IMAGE="postgres:$EXPECTED_POSTGRES_MAJOR" \
          make test_restore_independent
          make migration_preflight_fixture migration_artifact MIGRATOR_VERSION=ci SOURCE_REVISION="$GITHUB_SHA"

      - name: Upload migrator artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: dawgs-pg-migrate-postgresql-${{ matrix.postgres }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/dawgs-pg-migrate
            dist/dawgs-pg-migrate.sha256
            dist/dawgs-pg-migrate.metadata.txt
            dist/dawgs-pg-migrate.inputs.sha256
            dist/dawgs-pg-migrate.publication.sha256
            dist/archive-policy.md
            dist/dawgs-v1-export
            dist/dawgs-v1-export.sha256
            dist/dawgs-v1-export.metadata.txt

  physical-test-pg:
    name: Run physical tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dawgs
          POSTGRES_PASSWORD: weneedbetterpasswords
          POSTGRES_DB: dawgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawgs -d dawgs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Assert PostgreSQL major and run physical tests
        env:
          CONNECTION_STRING: postgres://dawgs:weneedbetterpasswords@localhost:5432/dawgs?sslmode=disable
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.postgres }}
          DAWGS_TEST_POSTGRES_DISPOSABLE: "1"
        run: |
          actual_version="$(psql "$CONNECTION_STRING" -XAtqc 'show server_version_num')"
          test "$((actual_version / 10000))" = "$EXPECTED_POSTGRES_MAJOR"
          ./scripts/prepare-test-pg -- make test_pg_physical
